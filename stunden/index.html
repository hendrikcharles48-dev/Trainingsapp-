<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stundenzettel</title>
<meta name="description" content="Minijob-Stunden eintragen, Spätzulage ab 20 Uhr, 603-€-Grenze im Blick und Schichten planen.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stunden">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Layout: iOS-App mit großem Titel, Ring für die 603-€-Grenze, Schichtliste, Tab-Leiste aus Glas und Plus-Knopf.
   Dunkel als Standard; Grün = Geld/Grundlohn, Violett = Spätzulage ab 20 Uhr. */
:root{
  --bg:#000; --card:#1C1C1E; --card-2:#2C2C2E; --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.14);
  --label:#fff; --label-2:rgba(235,235,245,.62); --label-3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.55);
  --green:#32D583; --green-soft:rgba(50,213,131,.16); --violet:#A594FF; --violet-soft:rgba(165,148,255,.18);
  --red:#FF6961; --red-soft:rgba(255,69,58,.16); --orange:#FFB340;
  --on-green:#04150C; --glass:rgba(22,22,24,.78); --glass-line:rgba(255,255,255,.08);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --r:20px; --tabh:62px; --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F2F2F7; --card:#fff; --card-2:#F2F2F7; --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.07);
  --label:#000; --label-2:rgba(60,60,67,.64); --label-3:rgba(60,60,67,.32); --sep:rgba(60,60,67,.18);
  --green:#1A9E5A; --green-soft:rgba(26,158,90,.13); --violet:#6B55E0; --violet-soft:rgba(107,85,224,.12);
  --red:#D70015; --red-soft:rgba(255,59,48,.12); --orange:#C25400;
  --on-green:#fff; --glass:rgba(249,249,251,.8); --glass-line:rgba(0,0,0,.07);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--label);font:17px/1.4 var(--font);-webkit-text-size-adjust:100%}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Seiten */
.page{padding:calc(var(--safe-t) + 14px) 16px calc(var(--tabh) + var(--safe-b) + 96px);max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{font:800 34px/1.1 var(--font);letter-spacing:-.02em;margin:0}
.eyebrow{font-size:13px;font-weight:600;color:var(--label-2);text-transform:uppercase;letter-spacing:.04em}
.monthnav{display:flex;gap:6px}
.monthnav button{width:36px;height:36px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:18px;color:var(--green)}
.monthnav button:disabled{color:var(--label-3)}
.card{background:var(--card);border-radius:var(--r);padding:18px}
.group-title{font-size:13px;color:var(--label-2);text-transform:uppercase;letter-spacing:.04em;margin:0 4px -12px}

/* Ring */
.hero{display:flex;flex-direction:column;align-items:center;gap:18px}
.ring{position:relative;width:168px;height:168px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .in b{font:700 30px/1 var(--round);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ring .in b small{font-size:16px;font-weight:600}
.ring .in span{font-size:13px;color:var(--label-2);margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.tiles div{background:var(--fill-2);border-radius:14px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:3px;min-width:0}
.tiles b{font:600 16px var(--round);font-variant-numeric:tabular-nums;white-space:nowrap}
.tiles span{font-size:12px;color:var(--label-2)}
.stats{display:flex;flex-direction:column;gap:10px;min-width:0}
.stat{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.stat span{font-size:14px;color:var(--label-2);white-space:nowrap}
.stat b{font:600 16px var(--round);font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.rest{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--green-soft);font-size:15px}
.rest.over{background:var(--red-soft);color:var(--red)}
.rest b{font-variant-numeric:tabular-nums}

/* Liste */
.list{background:var(--card);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;width:100%;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:76px;right:0;border-top:.5px solid var(--sep)}
.row:active{background:var(--fill-2)}
.day{width:48px;height:48px;border-radius:12px;background:var(--fill);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.day b{font:700 19px var(--round)}
.day span{font-size:11px;color:var(--label-2);margin-top:3px;text-transform:uppercase}
.mid{min-width:0;display:flex;flex-direction:column;gap:2px}
.mid .t{font-weight:600;font-variant-numeric:tabular-nums}
.mid .s{font-size:14px;color:var(--label-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{text-align:right;display:flex;flex-direction:column;gap:2px}
.right b{font:600 16px var(--round);font-variant-numeric:tabular-nums;white-space:nowrap}
.right span{font-size:13px;color:var(--label-2);font-variant-numeric:tabular-nums}
.spaet{color:var(--violet)}
.empty{padding:28px 20px;text-align:center;color:var(--label-2);font-size:15px}
.empty b{display:block;color:var(--label);font-size:17px;margin-bottom:4px}

/* Formulare */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:13px;color:var(--label-2);font-weight:500}
input,select{font:500 17px var(--font);color:var(--label);background:var(--fill-2);border:0;border-radius:12px;padding:12px 14px;width:100%;min-width:0;-webkit-appearance:none;appearance:none}
input[type=time],input[type=date]{min-height:46px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--label-2) 50%),linear-gradient(135deg,var(--label-2) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px}
.seg button{flex:1;padding:7px 8px;border-radius:8px;font-size:14px;font-weight:600;color:var(--label-2)}
.seg button[aria-pressed="true"]{background:var(--card-2);color:var(--label);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--fill);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.chip:active{background:var(--green-soft);color:var(--green)}
.btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--green);color:var(--on-green);font-weight:700;font-size:17px;text-align:center}
.btn:disabled{opacity:.4}
.btn.plain{background:var(--fill);color:var(--label)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.calc{border-radius:14px;background:var(--fill-2);padding:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.calc b{display:block;font:700 19px var(--round);font-variant-numeric:tabular-nums}
.calc span{font-size:12px;color:var(--label-2)}
.calc.err{display:block;color:var(--red);font-size:15px;text-align:left}
.hint{font-size:13px;color:var(--label-2);margin:0}

/* Einstellungen-Liste */
.set{background:var(--card);border-radius:var(--r);overflow:hidden}
.set .it{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:12px;align-items:center;padding:8px 8px 8px 16px;position:relative}
.set .it+.it::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.set .it label{font-size:16px;color:var(--label);font-weight:400}
.set .it input,.set .it select{text-align:right;padding:9px 12px;background:transparent;color:var(--label-2)}
.set .it select{padding-right:28px}
.set .act{display:block;width:100%;text-align:left;padding:14px 16px;color:var(--green);position:relative}
.set .act+.act::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}

/* Monate */
.mbar{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 16px;width:100%;text-align:left;position:relative}
.mbar+.mbar::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.mbar .track{height:8px;border-radius:9px;background:var(--fill);overflow:hidden}
.mbar .track i{display:block;height:100%;background:var(--green);border-radius:9px}
.mbar .track i.over{background:var(--red)}
.mbar b{font:600 15px var(--round);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Planer */
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) 32px;gap:10px;align-items:center;padding:12px 12px 12px 16px;position:relative}
@media (max-width:430px){.prow.pl{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 32px}.prow.pl .stepper{grid-column:1 / 3;justify-self:start}.prow.pl .x{grid-column:3;grid-row:1}}
.prow+.prow::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.stepper{display:flex;align-items:center;background:var(--fill-2);border-radius:12px}
.stepper button{width:34px;height:42px;font-size:20px;color:var(--green)}
.stepper b{min-width:2.6em;text-align:center;font-size:15px;font-variant-numeric:tabular-nums}
.stepper b small{display:block;font-size:10px;color:var(--label-2);font-weight:500}
.prow input{padding:10px 8px;font-size:16px;text-align:center}
.x{width:32px;height:32px;border-radius:50%;background:var(--fill);color:var(--label-2);font-size:16px}
.verdict{display:flex;flex-direction:column;gap:12px}
.big{font:800 34px/1 var(--round);font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;background:var(--green-soft);color:var(--green);vertical-align:middle}
.pill.bad{background:var(--red-soft);color:var(--red)}
.answer{padding:14px;border-radius:14px;background:var(--fill-2);font-size:15px}
.answer b{font-variant-numeric:tabular-nums}
.answer .k{font:700 24px var(--round);display:block;margin:2px 0;font-variant-numeric:tabular-nums}

.pbox{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:14px;background:var(--fill-2)}
.pbox input{background:var(--fill)}
/* Kalender */
.cal{display:grid;gap:4px;text-align:center}
.cal .wd{font-size:12px;font-weight:600;color:var(--label-2);padding-bottom:2px}
.cal button{aspect-ratio:1;border-radius:14px;font:600 16px/1 var(--round);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums}
.cal button small{font:600 10px/1 var(--round);min-height:10px;opacity:.85}
.cal .past{color:var(--label-3)}
.cal .today{color:var(--green);box-shadow:inset 0 0 0 1.5px var(--fill)}
.cal .plan{background:var(--green-soft);color:var(--green);box-shadow:inset 0 0 0 2px var(--green)}
.cal .unused{box-shadow:inset 0 0 0 2px var(--label-3);color:var(--label-2)}
.cal .done{background:var(--green);color:var(--on-green)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--label-2)}
.lg{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.lg.done{background:var(--green)}.lg.plan{background:var(--green-soft);box-shadow:inset 0 0 0 2px var(--green)}.lg.unused{box-shadow:inset 0 0 0 2px var(--label-3)}
.lg.fix{background:var(--violet-soft);box-shadow:inset 0 0 0 2px var(--violet)}.lg.off{background:repeating-linear-gradient(135deg,var(--fill) 0 3px,transparent 3px 6px)}
.cal{grid-template-columns:30px repeat(7,minmax(0,1fr))}
.cal .kw{aspect-ratio:auto;font:600 11px var(--round);color:var(--label-3);border-radius:10px}
.cal .kw.free{color:var(--orange)}
.cal .plan.fix{background:var(--violet-soft);color:var(--violet);box-shadow:inset 0 0 0 2px var(--violet)}
.cal .off{color:var(--label-3);background:repeating-linear-gradient(135deg,var(--fill-2) 0 4px,transparent 4px 8px)}
.days7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days7 button{padding:10px 0;border-radius:12px;background:var(--fill);font-weight:600;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:2px}
.days7 button small{font-size:11px;color:var(--label-2);font-weight:500}
.days7 button[aria-pressed="true"]{background:var(--green);color:var(--on-green)}
.days7 button[aria-pressed="true"] small{color:var(--on-green)}
.days7 button:disabled{opacity:.35}

/* Tab-Leiste & Plus */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;padding:6px 8px calc(var(--safe-b) + 4px);background:var(--glass);border-top:.5px solid var(--glass-line);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.tabbar button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--label-3);padding:4px 0}
.tabbar button svg{width:26px;height:26px}
.tabbar button[aria-current="page"]{color:var(--green)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(var(--tabh) + var(--safe-b) + 16px);z-index:21;width:60px;height:60px;border-radius:50%;background:var(--green);color:var(--on-green);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.fab svg{width:28px;height:28px}

/* Sheet */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:560px;max-height:calc(100% - var(--safe-t) - 12px);overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:8px 16px calc(var(--safe-b) + 20px);display:flex;flex-direction:column;gap:16px;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.grab{width:38px;height:5px;border-radius:9px;background:var(--fill);margin:4px auto 0}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h2{margin:0;font-size:20px}
.sheet-head button{color:var(--green);font-weight:600;font-size:17px;padding:6px}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{background:transparent}}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + var(--safe-b) + 90px);transform:translateX(-50%);z-index:50;background:var(--card-2);color:var(--label);padding:10px 16px;border-radius:99px;font-size:15px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.4);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-wrap{animation:none}}
@media (max-width:360px){.tiles b{font-size:14px}}
</style>
</head>
<body>
<main id="view"></main>
<button class="fab" id="fab" type="button" aria-label="Schicht eintragen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="tabbar" aria-label="Bereiche">
  <button type="button" data-tab="monat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Monat</button>
  <button type="button" data-tab="planer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Planer</button>
  <button type="button" data-tab="mehr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V11M12 19V5M19 19v-6"/></svg>Übersicht</button>
</nav>
<div id="sheet" class="sheet-wrap" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY = 'stundenzettel-v2';
const DEF = {lohn:18.39, grenze:603, wochen:4.35, proz:25, ab:'20:00', zaehlt:true, theme:'dark'};
const MONATE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const WT = ['So','Mo','Di','Mi','Do','Fr','Sa'];

// ---------- Daten ----------
let st = {entries:[], S:{...DEF}, plan:[{anz:2, per:'w', von:'14:00', bis:'22:30'}], extra:{anz:1, per:'w', von:'14:00'}, cal:{}, free:{}, tpl:[], calStart:'14:00', calMode:'voll', pmode:'kal'};
function load(){ try{ const d = JSON.parse(localStorage.getItem(KEY) || 'null'); if(d) st = {...st, ...d, S:{...DEF, ...(d.S||{})}}; }catch(_){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(_){ toast('Speichern nicht möglich'); } }
const S = () => st.S;

// ---------- Rechnen ----------
const toMin = t => { if(!t) return null; const [h,m] = t.split(':').map(Number); return h*60+m; };
const hhmm = m => { m = ((m%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); };
const fmt = min => { min = Math.round(min); const h = Math.floor(min/60), m = min%60; return h&&m ? `${h} Std ${m} Min` : h ? `${h} Std` : `${m} Min`; };
const fmtS = min => { min = Math.round(min); return `${Math.floor(min/60)}:${String(min%60).padStart(2,'0')}`; };
const eur = v => v.toLocaleString('de-DE', {style:'currency', currency:'EUR'});
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const iso = d => { const x = new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,10); };
const today = () => iso(new Date());
const ymOf = d => d.slice(0,7);
const curYM = () => today().slice(0,7);
const autoPause = g => g > 9*60 ? 45 : g > 6*60 ? 30 : 0;
const MAXG = 10*60 + 45; // höchstens 10 Std Arbeit + Pause

// Vorschlag, wann die Pause liegt: direkt vor der Spätzulage, spätestens nach 6 Std Arbeit
function suggestPause(s, e, len){
  const ab = toMin(S().ab), abA = ab >= s ? ab : ab + 1440;
  let c = abA - len >= s + 60 ? Math.min(abA - len, s + 360) : s + Math.min(360, Math.floor((e - s - len) / 2));
  c = Math.max(s, Math.min(c, e - len));
  return c - (c % 5);
}
// Schicht von–bis; pauseIn = Pausenlänge (null = gesetzlich), pauseVon = Beginn der Pause (null = Vorschlag)
function shift(von, bis, pauseIn, pauseVon){
  const s = toMin(von), e0 = toMin(bis); if(s == null || e0 == null) return null;
  let e = e0; if(e <= s) e += 1440;
  const gross = e - s, pause = pauseIn == null ? autoPause(gross) : Math.min(pauseIn, gross), paid = gross - pause;
  const ab = toMin(S().ab);
  const inWin = (a, b) => { const ov = (x, y) => Math.max(0, Math.min(b, y) - Math.max(a, x)); return ov(ab, 1440+360); }; // nur ab 20 Uhr am Tag der Schicht (bis morgens), Frühschichten bekommen keine Zulage
  let pS = null, pauseBad = false;
  if(pause > 0){
    if(pauseVon){ pS = toMin(pauseVon); if(pS < s) pS += 1440; if(pS < s || pS + pause > e) pauseBad = true; }
    else pS = suggestPause(s, e, pause);
  }
  const spaet = Math.max(0, inWin(s, e) - (pS != null && !pauseBad ? inWin(pS, pS + pause) : 0));
  return {gross, pause, paid, spaet: Math.min(paid, spaet), pauseVon: pS != null ? hhmm(pS) : null, pauseBis: pS != null ? hhmm(pS + pause) : null, pauseBad, pauseSpaet: pS != null && !pauseBad && inWin(pS, pS + pause) > 0};
}
const money = (paid, spaet) => { const base = paid/60*S().lohn, zul = spaet/60*S().lohn*S().proz/100; return {base, zul, sum: base+zul, zaehlt: base + (S().zaehlt ? zul : 0)}; };
function maxShift(von, budget){
  let best = null;
  for(let g = 1; g <= MAXG; g++){ const r = shift(von, hhmm(toMin(von)+g), null); if(money(r.paid, r.spaet).zaehlt <= budget + .005 && (!best || r.paid > best.paid)) best = {...r, bis: hhmm(toMin(von)+g)}; }
  return best;
}
function sumOf(list){
  let paid = 0, spaet = 0, base = 0, zul = 0;
  for(const e of list){ const m = money(e.minuten||0, e.spaetMin||0); paid += e.minuten||0; spaet += e.spaetMin||0; base += m.base; zul += m.zul; }
  return {paid, spaet, base, zul, zaehlt: base + (S().zaehlt ? zul : 0), n: list.length};
}
const monthEntries = ym => st.entries.filter(e => (e.datum||'').startsWith(ym)).sort((a,b) => b.datum.localeCompare(a.datum) || (b.von||'').localeCompare(a.von||''));

// ---------- Navigation ----------

function go(t){ tab = t; document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-current', b.dataset.tab === t ? 'page' : 'false')); render(); window.scrollTo(0,0); }

// ---------- Monat ----------
function ring(pct, over){
  const r = 60, c = 2*Math.PI*r, p = Math.min(1, pct);
  return `<svg viewBox="0 0 132 132" aria-hidden="true"><circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--fill)" stroke-width="9"/>
    <circle cx="66" cy="66" r="${r}" fill="none" stroke="${over ? 'var(--red)' : 'var(--green)'}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" ${p===0?'opacity="0"':''}/></svg>`;
}
function viewMonat(){
  const [y,m] = ym.split('-').map(Number), list = monthEntries(ym), t = sumOf(list), isCur = ym === curYM();
  const rest = S().grenze - t.zaehlt;
  let restHtml;
  if(rest < 0) restHtml = `<div class="rest over">Über der Grenze um <b>${eur(-rest)}</b>.</div>`;
  else if(isCur && ziel() < S().grenze){
    const rz = ziel() - t.zaehlt;
    restHtml = rz > 0 ? `<div class="rest">Noch <b>${eur(rz)}</b> bis zu deinem Ziel von ${eur(ziel())}. Das sind <b>${fmt(Math.floor(rz/S().lohn*60))}</b> Arbeit vor ${S().ab} Uhr.</div>`

  }

    const s = maxShift('14:00', rest);
    restHtml = `<div class="rest">Noch <b>${eur(rest)}</b> frei. Das sind <b>${fmt(Math.floor(rest/S().lohn*60))}</b> Arbeit vor ${S().ab} Uhr${s && s.paid>0 && s.spaet>0 && s.gross<MAXG ? `, oder eine Schicht <b>14:00–${s.bis}</b>` : ''}.</div>`;
  } else restHtml = `<div class="rest">${eur(rest)} unter der Grenze geblieben.</div>`;
  const v = $('#view');
  v.innerHTML = `<div class="page">
    <div class="top"><div><div class="eyebrow">${isCur ? 'Dieser Monat' : y}</div><h1>${MONATE[m-1]}</h1></div>

        <div class="tiles">

        </div>
      </div>

    </section>
    <p class="group-title">${t.n} ${t.n===1?'Schicht':'Schichten'}</p>
    <section class="list" id="list"></section>
  </div>`;
  $('#prev').onclick = () => { ym = iso(new Date(y, m-2, 1)).slice(0,7); render(); };
  $('#next').onclick = () => { if(!isCur){ ym = iso(new Date(y, m, 1)).slice(0,7); render(); } };

// ---------- Kalender-Planer ----------
// st.cal[datum] = {von, max (bezahlte Min., null = automatisch), bis (nur bei fester Zeit)}
// st.free[montag] = true: ganze Woche frei; st.tpl = [Wochentage 0–6] der normalen Woche
const NOPAUSE = 360, MAXPAID = 600; // bis 6 Std ohne Pause, höchstens 10 Std Arbeit
const ziel = () => Math.min(S().grenze, S().ziel || S().grenze);
const monday = d => { const x = new Date(d+'T12:00'); x.setDate(x.getDate() - (x.getDay()+6)%7); return iso(x); };
const kw = d => { const x = new Date(d+'T12:00'); x.setDate(x.getDate() + 3 - (x.getDay()+6)%7); const j = new Date(x.getFullYear(), 0, 4); return 1 + Math.round(((x - j)/864e5 - 3 + (j.getDay()+6)%7) / 7); };
function shiftPaid(von, paid){
  let gross = paid; if(paid > 360){ gross = paid + 30; if(gross > 540) gross = paid + 45; }
  const bis = hhmm(toMin(von) + gross), r = shift(von, bis, null);
  return {...r, von, bis, cost: money(r.paid, r.spaet).zaehlt};
}
// Budget R auf flexible Tage verteilen (Viertelstunden); x.cap = längste bezahlte Zeit an diesem Tag
function distribute(days, R, mode){
  const cost = (x, p) => p ? shiftPaid(x.von, p).cost : 0;
  const res = days.map(x => ({...x, p:0}));
  if(mode === 'voll'){
    let left = R;
    for(const x of res){ let p = x.cap; while(p > 0 && cost(x,p) > left + .005) p -= 15; x.p = p; left -= cost(x,p); }
  } else {
    let p = Math.max(0, ...res.map(x => x.cap));
    const tot = q => res.reduce((a,x) => a + cost(x, Math.min(q, x.cap)), 0);
    while(p > 0 && tot(p) > R + .005) p -= 15;
    res.forEach(x => x.p = Math.min(p, x.cap));
    let left = R - tot(p);
    for(const x of res){ const d = cost(x, x.p+15) - cost(x, x.p); if(x.p + 15 <= x.cap && d <= left + .005){ left -= d; x.p += 15; } }
  }
  const out = res.map(x => ({...x, s: x.p ? shiftPaid(x.von, x.p) : null}));
  return {res: out, used: out.reduce((a,x) => a + (x.s ? x.s.cost : 0), 0)};
}
function recRows(list){
  return list.map(x => {
    const d = new Date(x.d+'T12:00'), s = x.s;
    const tag = (x.fix ? 'fest · ' : '') + (s && s.pause ? `Pause ${s.pauseVon}–${s.pauseBis}` : 'ohne Pause');
    return `<button type="button" class="row" data-day="${x.d}"><div class="day"><b>${d.getDate()}</b><span>${WT[d.getDay()]}</span></div>
      <div class="mid">${s ? `<span class="t">${s.von}–${s.bis}${x.fix ? ' <span class="pill" style="font-size:11px">fest</span>' : ''}</span><span class="s">${fmt(s.paid)} · ${tag}${s.spaet ? ` · <span class="spaet">${fmt(s.spaet)} spät</span>` : ''}</span>`
        : `<span class="t" style="color:var(--label-2)">Frei</span><span class="s">Für dein Ziel nicht nötig</span>`}</div>
      <div class="right">${s ? `<b>${eur(s.cost)}</b>` : ''}</div></button>`;
  }).join('');
}
// Plan für einen Monat berechnen
function calPlan(ymX){

    const [yy,mm] = k.split('-').map(Number), t = sumOf(by[k]), p = Math.min(100, t.zaehlt/S().grenze*100);
    const b = document.createElement('button'); b.type = 'button'; b.className = 'mbar';
    b.innerHTML = `<span>${MONATE[mm-1].slice(0,3)} ${String(yy).slice(2)}</span><span class="track"><i class="${t.zaehlt>S().grenze?'over':''}" style="width:${p}%"></i></span><b>${eur(t.zaehlt)}</b>`;
    b.onclick = () => { ym = k; go('monat'); };
    ml.append(b);
  }
  const bind = (id, key, conv) => $(id).onchange = () => { const val = conv($(id).value); if(val != null && val !== '' ){ st.S[key] = val; save(); toast('Gespeichert'); } };
  bind('#sLohn','lohn',num); bind('#sGrenze','grenze',num); bind('#sProz','proz',num); bind('#sW','wochen',num); bind('#sAb','ab',v=>v||null);
  $('#sZiel').onchange = () => { const v = num($('#sZiel').value); st.S.ziel = v && v > 0 ? Math.min(v, S().grenze) : null; save(); toast('Gespeichert'); };
  $('#sZ').value = S().zaehlt ? '1' : '0'; $('#sZ').onchange = () => { st.S.zaehlt = $('#sZ').value === '1'; save(); toast('Gespeichert'); };
  $('#sT').value = S().theme; $('#sT').onchange = () => { st.S.theme = $('#sT').value; save(); applyTheme(); };
  $('#bExp').onclick = exportData;
  $('#bImp').onclick = () => $('#fImp').click();
  $('#fImp').onchange = importData;
}
async function exportData(){
  const name = `stundenzettel-${today()}.json`, data = JSON.stringify({app:'stundenzettel', v:2, ...st}, null, 1);
  const file = new File([data], name, {type:'application/json'});
  try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Stundenzettel-Backup'}); return; } }catch(e){ if(e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function importData(ev){
  const f = ev.target.files[0]; if(!f) return;
  f.text().then(t => {
    const d = JSON.parse(t); if(!Array.isArray(d.entries)) throw 0;
    const ids = new Set(st.entries.map(e => e.id)); let n = 0;
    for(const e of d.entries) if(e && e.id && e.datum && !ids.has(e.id)){ st.entries.push(e); n++; }
    if(d.S) st.S = {...DEF, ...d.S};
    save(); toast(`${n} Schichten geladen`); render();
  }).catch(() => toast('Datei konnte nicht gelesen werden'));
}

// ---------- Darstellung & Start ----------
const mq = matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){
  const t = S().theme === 'auto' ? (mq.matches ? 'dark' : 'light') : S().theme;
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#000000' : '#F2F2F7';
}
mq.addEventListener?.('change', applyTheme);
let lastDay = today();
function dayCheck(){ const t = today(); if(t === lastDay) return; if(ym === lastDay.slice(0,7)) ym = t.slice(0,7); lastDay = t; render(); }
setInterval(dayCheck, 30000);
document.addEventListener('visibilitychange', () => { if(!document.hidden) dayCheck(); });
load(); applyTheme();
// Spätminuten gespeicherter Schichten neu rechnen (alte Version zählte bei Frühschichten 0–6 Uhr fälschlich mit)
let fixed = 0;
for(const e of st.entries){ if(!e.von || !e.bis) continue; const r = shift(e.von, e.bis, e.pause ?? null, e.pauseVon || null); if(r && r.spaet !== e.spaetMin){ e.spaetMin = r.spaet; fixed++; } }
if(fixed) save();
go('monat');
if('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
</script>
</body>
