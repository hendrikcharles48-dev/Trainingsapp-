<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#111113"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Satzwerk">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Satzwerk Training</title>
<meta name="theme-color" content="#111113">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mouse+Memoirs&family=Oxanium:wght@500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Bewusst ein dunkles Design (wie die Vorlage) mit Lime- und Lavendel-Akzenten */
:root{
  color-scheme:dark;
  --bg:#111113; --surface:#1C1C1F; --surface2:#27272C; --sunk:#0A0A0C; --glass:rgba(34,34,39,.82);
  --ink:#F4F4F6; --ink2:#C2C2CB; --muted:#8A8A94; --line:rgba(255,255,255,.07);
  --lime:#DCF27E; --lime2:#C9E85C; --lav:#B7A5F7; --lilac:#D9CAFB; --violet:#8F79F2; --rose:#F5A3C7;
  --on-light:#141416;
  --accent:var(--lime); --accent-ink:var(--on-light); --accent-soft:rgba(220,242,126,.12);
  --good:#9BE37B; --warn:#F6C85F; --bad:#FF7A8A;
  --r-main:#DCF27E; --r-sec:#B7A5F7; --r-iso:#7FD6E8; --r-skill:#F5A3C7; --r-core:#F6C85F; --r-cond:#FF9C73;
  --display:"Mouse Memoirs","Arial Narrow",-apple-system,system-ui,sans-serif;
  --body:"Mouse Memoirs","Arial Narrow",-apple-system,system-ui,sans-serif;
  --r:28px; --tabh:72px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:600 15.5px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none;transition:transform .12s}
button:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:28px} h2{font-size:22px} h3{font-size:18px;font-weight:600}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.muted{color:var(--muted)} .ink2{color:var(--ink2)} .small{font-size:13.5px} .tiny{font-size:12px}
.row{display:flex;gap:10px;align-items:center} .wrap{flex-wrap:wrap} .grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.between{justify-content:space-between}
.on-light{color:var(--on-light)} .on-light .muted,.on-light .eyebrow{color:rgba(20,20,22,.62)}

#app{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--tabh) + 48px)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--bg) 72%,transparent);display:flex;align-items:center;gap:12px;padding-block:14px 12px}
.topbar h1{flex:1}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface2);display:grid;place-items:center;flex:none;color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--lime);color:var(--on-light);display:grid;place-items:center;font:800 18px var(--display);flex:none}

/* Schwebende Navigation mit runden Knöpfen */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:20;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);border:1px solid var(--line);border-radius:999px;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.tabs nav{display:flex;gap:6px;padding:7px}
.tabs button{width:56px;height:56px;border-radius:50%;border:0;background:var(--surface2);display:grid;place-items:center;color:var(--ink2)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{background:var(--lav);color:var(--on-light)}
.tabs button span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.card{background:var(--surface);border-radius:var(--r);padding:18px}
.card.flat{background:var(--surface2)}
.card.lime{background:var(--lime);color:var(--on-light)}
.card.lav{background:var(--lav);color:var(--on-light)}
.card.lilac{background:var(--lilac);color:var(--on-light)}
.card.lime .eyebrow,.card.lav .eyebrow,.card.lilac .eyebrow{color:rgba(20,20,22,.6)}
.card.lime .meter,.card.lav .meter{background:rgba(20,20,22,.12)}
.card.lime .meter i,.card.lav .meter i{background:#141416}
.rings-bg{position:relative;overflow:hidden;isolation:isolate}
.rings-bg::before{content:"";position:absolute;right:-70px;top:-70px;width:260px;height:260px;border-radius:50%;background:repeating-radial-gradient(circle,rgba(20,20,22,.07) 0 3px,transparent 3px 26px);z-index:-1}
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:24px;overflow:hidden}
.list>*{padding:12px 16px;position:relative}
.list>*+*::before{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;background:var(--line)}
.li{display:flex;gap:12px;align-items:center;background:none;border:0;text-align:left;width:100%}
.chev{color:var(--muted);flex:none;opacity:.7}
[data-drag]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.li.shift,.qrow.shift{transition:transform .16s ease}
.li.dragging,.qrow.dragging{position:relative;opacity:1;z-index:6;background:var(--surface2);border-radius:18px;box-shadow:0 14px 34px rgba(0,0,0,.55);transition:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:0;background:var(--surface2);padding:12px 18px;font-weight:700;min-height:48px;color:var(--ink)}
.btn.primary{background:var(--lime);color:var(--on-light)}
.btn.lav{background:var(--lav);color:var(--on-light)}
.btn.dark{background:var(--on-light);color:#fff}
.btn.white{background:#fff;color:var(--on-light)}
.btn.big{min-height:58px;font-size:17px;font-family:var(--display);font-weight:700;width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:38px;padding:7px 14px;font-size:13.5px}
.btn.outline{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn:disabled{opacity:.4}
.btn svg{width:18px;height:18px}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:9px 6px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--on-light)}
.seg.onlight{background:rgba(20,20,22,.1)}
.seg.onlight button{color:rgba(20,20,22,.6)}
.seg.onlight button[aria-pressed="true"]{background:var(--on-light);color:#fff}
.toptabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.toptabs button{flex:1;background:none;border:0;padding:12px 4px;font:700 15px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.toptabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:700;background:transparent;border:1.5px solid rgba(255,255,255,.14);color:var(--ink2);white-space:nowrap}
.chip.on{background:#fff;color:var(--on-light);border-color:#fff}
.chip.set{background:var(--surface2);border-color:transparent;color:var(--ink)}
.chip.solid{background:var(--surface2);border-color:transparent}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin-inline:-2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.tag{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;background:rgba(20,20,22,.14)}
.plate{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 12px/1 var(--display);color:var(--on-light);background:var(--c)}
.p-main{--c:var(--r-main)} .p-sec{--c:var(--r-sec)} .p-iso{--c:var(--r-iso)} .p-skill{--c:var(--r-skill)} .p-core{--c:var(--r-core)} .p-cond{--c:var(--r-cond)}
input.field,select.field,textarea.field{width:100%;border:1.5px solid transparent;background:var(--surface);border-radius:18px;padding:12px 16px;min-height:52px;font-size:16.5px;font-weight:700}
input.field:focus,select.field:focus,textarea.field:focus{border-color:var(--lav);outline:none}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:18px;padding:0 16px;min-height:54px}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:16.5px;font-weight:600;outline:none}
label.lbl,.lbl{display:block;font-weight:700;font-size:13px;margin-bottom:6px;color:var(--muted)}
.hero{padding:20px;border-radius:30px;background:var(--surface)}
.xl{font-size:30px;font-weight:800}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border-radius:22px;padding:12px 14px}
.kpi b{display:block;font:700 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted);font-weight:700}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.section{margin-top:18px;display:flex;flex-direction:column;gap:12px}
.section>.head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.empty{padding:26px;text-align:center;color:var(--muted);background:var(--surface);border-radius:var(--r)}
.meter{height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;position:relative}
.on-light .meter{background:rgba(20,20,22,.12)}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--lime);border-radius:99px}
.on-light .meter i{background:var(--on-light)}
.pillpct{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 12px 6px 6px;background:rgba(20,20,22,.1);font:700 13px var(--display)}
.pillpct i{display:block;width:54px;height:20px;border-radius:99px;background:#fff;position:relative;overflow:hidden}
.pillpct i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--p);background:var(--on-light);border-radius:99px}

/* Kalenderleiste */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .d{font-size:12px;color:var(--muted);font-weight:700}
.cal .n{margin:6px auto 0;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 16px var(--display);color:var(--ink2);position:relative}
.cal .n.today{background:var(--lime);color:var(--on-light)}
.cal .n.done::after{content:"";position:absolute;bottom:-5px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--lav)}

/* Figuren */
.fig{display:block;width:100%;height:auto}
.fnear{stroke:#EEEEF2}.ffar{stroke:#9C9CA7}.fhead{fill:#EEEEF2}.ffloor{fill:rgba(255,255,255,.07)}
.fp{fill:#7E7E89;stroke:#7E7E89}.fp2{fill:#5F5F6A;stroke:none}.fl{stroke:#5A5A64}.fl2{fill:#1C1C1F}.fring{stroke:#D4D4DC;stroke-width:3}.fbox{fill:#34343B}.fband{fill:var(--lav)}.ffarf{fill:#9C9CA7}.fband2{stroke:var(--lav)}
.figdark .fnear{stroke:#1B1B1E}.figdark .ffar{stroke:#5B5B63}.figdark .fhead{fill:#1B1B1E}.figdark .ffarf{fill:#5B5B63}.figdark .ffloor{fill:rgba(20,20,22,.08)}
.figdark .fp{fill:#3F3F46;stroke:#3F3F46}.figdark .fp2{fill:#2F2F35}.figdark .fl{stroke:#44444B}.figdark .fl2{fill:#DCF27E}.figdark .fring{stroke:#2A2A2F}.figdark .fbox{fill:rgba(20,20,22,.18)}
.tile{background:#242428;border-radius:22px;overflow:hidden}
.thumb{width:48px;height:48px;border-radius:14px;background:#242428;flex:none;overflow:hidden}
.thumb .fig{width:100%;height:100%}
.exgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.extile{background:none;border:0;padding:0;text-align:center;display:flex;flex-direction:column;gap:6px;min-width:0}
.extile .tile{aspect-ratio:1;width:100%;display:grid;place-items:center;padding:6px}
.extile span{font-size:12.5px;font-weight:700;line-height:1.25;color:var(--ink2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.extile.off .tile{opacity:.45}
.extile .tile{position:relative}
.extile .star{position:absolute;top:7px;right:7px;width:24px;height:24px;border-radius:50%;background:var(--lime);color:var(--on-light);display:grid;place-items:center;font-size:14px;line-height:1}
.favbtn{position:absolute;top:14px;right:14px;z-index:3;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:var(--ink2);font-size:24px;line-height:1;display:grid;place-items:center}
.favbtn.on{background:var(--lime);color:var(--on-light)}

/* Plan-Karten */
.daycard{position:relative;border-radius:30px;padding:18px;min-height:168px;display:flex;overflow:hidden;border:0;text-align:left;width:100%;color:var(--on-light)}
.daycard .txt{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;gap:6px;max-width:62%}
.daycard .figwrap{position:absolute;right:0;bottom:-6px;width:44%;height:100%;z-index:1;display:flex;align-items:flex-end}
.minbadge{position:absolute;top:12px;right:12px;z-index:3;width:58px;height:58px;border-radius:50%;background:var(--on-light);color:#fff;display:grid;place-items:center;text-align:center;font:700 16px/1 var(--display)}
.minbadge small{display:block;font:700 10px var(--body);opacity:.8;margin-top:2px}
.ringnum{position:relative;flex:none}
.ringnum b{position:absolute;inset:0;display:grid;place-items:center;font:700 13px var(--display)}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.overlay .inner{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-bottom,0px) + 190px)}
.ohead{position:sticky;top:0;z-index:3;background:linear-gradient(var(--bg) 75%,transparent);display:flex;align-items:center;gap:12px;padding-block:10px 14px}
.scrim{overscroll-behavior:contain;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center}
.sheet{overscroll-behavior:contain;background:var(--bg);width:100%;max-width:620px;border-radius:32px 32px 0 0;max-height:92vh;overflow-y:auto;padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 24px);border-top:1px solid var(--line)}
.sheettop{position:sticky;top:-10px;z-index:5;margin:-10px -18px 6px;padding:10px 18px 6px;background:var(--bg);touch-action:none}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:rgba(255,255,255,.25);margin:4px auto 6px}
.sheetx{position:absolute;right:12px;top:8px;width:38px;height:38px;border-radius:50%;border:0;background:var(--surface2);color:var(--ink);display:grid;place-items:center}
.sheetx svg{width:18px;height:18px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .28s cubic-bezier(.2,.9,.3,1)}@keyframes up{from{transform:translateY(40px);opacity:.3}}}
@media (prefers-reduced-motion:reduce){.fig animate,.fig animateTransform{display:none}}

/* Training */
.stage{position:relative;background:#1E1E22;border-radius:32px;overflow:hidden;aspect-ratio:1/0.9}
.stage .fig{position:absolute;left:6%;bottom:0;width:70%;height:70%}
.stage .over{position:absolute;left:18px;top:16px;right:84px}
.stage .over h2{font-size:24px}
.setpill{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:#fff;border-radius:999px;padding:10px 8px;display:flex;flex-direction:column;gap:5px;align-items:center}
.setpill i{display:block;width:26px;height:8px;border-radius:99px;background:rgba(183,165,247,.35)}
.setpill i.on{background:var(--violet)}
.setpill i.cur{background:var(--lime2)}
.setpill b{font:700 11px var(--display);color:var(--on-light)}
.target{padding:16px;border-radius:24px;background:var(--lime);color:var(--on-light);display:flex;flex-direction:column;gap:5px}
.target b{font:800 30px/1.1 var(--display);font-variant-numeric:tabular-nums}
.target .note{font-size:13.5px;font-weight:700;color:rgba(20,20,22,.72)}
.target .eyebrow{color:rgba(20,20,22,.6)}
.target .btn{background:rgba(20,20,22,.1);color:var(--on-light)}
.sets{width:100%;border-collapse:separate;border-spacing:0 6px}
.sets th{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:center;padding:2px}
.sets td{text-align:center;padding:5px 3px;background:var(--surface)}
.sets td:first-child{border-radius:16px 0 0 16px} .sets td:last-child{border-radius:0 16px 16px 0}
.sets td:first-child,.sets th:first-child{width:34px}
.sets tr.done td{background:rgba(155,227,123,.1)}
.sets tr.next td{background:var(--surface2)}
.sets td.prev{font:600 13px var(--display);color:var(--muted)}
.sets input{width:100%;max-width:84px;text-align:center;border:1.5px solid transparent;border-radius:12px;background:var(--bg);min-height:44px;font:700 19px/1 var(--display);font-variant-numeric:tabular-nums;padding:0 2px}
.sets input:focus{border-color:var(--lav);outline:none}
.setno{font:700 15px var(--display);color:var(--muted)}
.check{width:44px;height:44px;border-radius:50%;border:0;background:var(--bg);display:grid;place-items:center;color:var(--muted)}
.next .check{background:var(--lime);color:var(--on-light)}
.check svg{width:22px;height:22px}
.done .check{background:var(--good);color:var(--on-light)}
.rirtag{font:700 15px var(--display);color:var(--ink2)}
.exfoot{display:flex;gap:6px;flex-wrap:wrap}
.qrow{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:22px;padding:8px 14px 8px 8px;border:0;width:100%;text-align:left}
.qrow.done{opacity:.55}
.qrow .thumb{width:56px;height:56px}
.panel{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:45;max-width:600px;margin:0 auto;background:#F4F4F6;color:var(--on-light);border-radius:30px;padding:14px 18px 14px;box-shadow:0 -10px 40px rgba(0,0,0,.45)}
.panel::before{content:"";position:absolute;top:8px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:9px;background:rgba(20,20,22,.18)}
.panel .cols{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;margin-top:6px}
.panel .cols small{display:block;font-size:12px;font-weight:700;color:rgba(20,20,22,.55)}
.panel .cols .v{font:700 18px var(--display);font-variant-numeric:tabular-nums}
.panel .big{font:800 44px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.02em;text-align:center}
.panel .ctrl{display:flex;gap:8px;margin-top:10px}
.panel .ctrl button{flex:1;border:0;border-radius:999px;min-height:42px;background:rgba(20,20,22,.08);color:var(--on-light);font-weight:800}
.panel .ctrl button.go{background:var(--on-light);color:#fff}
.panel .prog{height:5px;border-radius:9px;background:rgba(20,20,22,.1);overflow:hidden;margin-top:10px}
.panel .prog i{display:block;height:100%;background:var(--violet);border-radius:9px}
.rirgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rirgrid button{border:0;background:var(--surface);border-radius:22px;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.rirgrid button b{font:800 28px/1 var(--display)}
.rirgrid button span{font-size:12px;color:var(--muted);font-weight:700}
.rirgrid button.suggest{background:var(--lime);color:var(--on-light)}
.rirgrid button.suggest span{color:rgba(20,20,22,.65)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:50px;height:50px;border-radius:50%;border:0;background:var(--surface2);font:700 24px var(--display)}
.stepper input{flex:1;min-width:0;text-align:center;font:800 28px var(--display);border:0;border-radius:18px;min-height:50px;background:var(--surface)}
.platebar{display:flex;align-items:center;justify-content:center;gap:3px;padding:18px 0}
.platebar .sleeve{width:30px;height:12px;background:#9C9CA7;border-radius:3px}
.platebar .bar{width:70px;height:8px;background:#C2C2CB;border-radius:3px}
.platebar .pl{width:16px;border-radius:5px;display:grid;place-items:center;font:800 9px var(--display);color:var(--on-light);writing-mode:vertical-rl}

/* Fragebogen */
.qprog{height:6px;background:var(--surface2);border-radius:9px;overflow:hidden}
.qprog i{display:block;height:100%;background:var(--lime);border-radius:9px;transition:width .3s}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:0;background:var(--surface);border-radius:22px;padding:15px 16px;min-height:62px}
.opt[aria-pressed="true"]{background:var(--lav);color:var(--on-light)}
.opt[aria-pressed="true"] small{color:rgba(20,20,22,.65)}
.opt .dot{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.25);flex:none;display:grid;place-items:center}
.opt[aria-pressed="true"] .dot{border-color:var(--on-light);background:var(--on-light)}
.opt[aria-pressed="true"] .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--lav)}
.opt.multi .dot{border-radius:8px}
.opt b{display:block;font-weight:800}
.opt small{display:block;color:var(--muted);font-size:13.5px;font-weight:600}

/* Diagramme */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font:700 11.5px var(--body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--lime);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--lime);opacity:.12}
.chart .pt{fill:var(--lime);stroke:var(--surface);stroke-width:2}
.tip{font:700 13px var(--body);color:var(--ink)}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:104px 1fr 42px;gap:10px;align-items:center;font-size:14px;font-weight:700}
.bar .track{height:12px;border-radius:99px;background:var(--surface2);position:relative;overflow:hidden}
.bar .track i{position:absolute;inset:0 auto 0 0;background:var(--lav);border-radius:99px}
.bar .track .band{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.1)}
.bar .track i.lime{background:var(--lime)}
.bar .track i.warn{background:var(--rose)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat span{aspect-ratio:1;border-radius:7px;background:var(--surface2);max-width:100%}
.heat span.l2{background:var(--lime)}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.badge{min-width:0;overflow-wrap:anywhere;background:var(--surface);border-radius:22px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.badge .ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:800 20px var(--display);background:var(--surface2);color:var(--muted)}
.badge.got .ic{background:var(--lime);color:var(--on-light)}
.badge b{font-size:13px;line-height:1.2}
.badge span{font-size:11.5px;color:var(--muted);line-height:1.25}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 34px);z-index:80;background:#fff;color:var(--on-light);padding:12px 18px;border-radius:20px;font-weight:800;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 12px 32px rgba(0,0,0,.4)}
.toast.top{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 14px)}
.pr{color:var(--rose);font-weight:800}
.loading{min-height:70vh;display:grid;place-items:center;text-align:center}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14px}
.tbl td,.tbl th{padding:9px 8px;border-top:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl tr:first-child th{border-top:0}
.tbl th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.bigtimer{font:800 88px/1 var(--display);text-align:center;font-variant-numeric:tabular-nums}
.phase{text-align:center;font:800 20px var(--display);text-transform:uppercase;letter-spacing:.12em}
.why{font-size:12px;display:flex;gap:6px;flex-wrap:wrap;font-weight:700}
.why span{background:var(--surface2);color:var(--ink2);border-radius:999px;padding:3px 9px}
@media (max-width:380px){ h1{font-size:25px} .xl{font-size:26px} .tabs button{width:50px;height:50px} .bar{grid-template-columns:88px 1fr 38px} .sets input{min-height:40px;font-size:17px} .panel .big{font-size:38px} .cal .n{width:36px;height:36px} }
